apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hopps
spec:
  chart:
    spec:
      chart: hopps
      sourceRef:
        kind: HelmRepository
        name: hopps
      version: 0.2.11
  interval: 1m0s
  values:
    # az-document-ai
    azDocumentAi:
      image:
        tag: "1008"
      envFrom:
        - secretRef:
            name: az-document-ai
    # org
    org:
      image:
        tag: "1014"
      envFrom:
        - secretRef:
            name: org
      envVars:
        # Database secrets
        - name: quarkus.datasource.jdbc.url
          value: jdbc:postgresql://postgres-cluster-rw:5432/org?loggerLevel=OFF&sslmode=require
        - name: quarkus.swagger-ui.path
          value: /q/swagger-ui
        - name: quarkus.smallrye-openapi.path
          value: /q/openapi
        - name: HOPPS_SPA_URL
          value: https://dev.${DOMAIN_2}/
        - name: APP_HOPPS_ORG_AUTH_INVITATION_CLIENT_ID
          value: hopps-frontend
        - name: quarkus.datasource.username
          valueFrom:
            secretKeyRef:
              name: org-db-secret
              key: username
        - name: quarkus.datasource.password
          valueFrom:
            secretKeyRef:
              name: org-db-secret
              key: password
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.middlewares: hopps-dev-cors-api@kubernetescrd
        ingressClassName: traefik
        hosts:
          - host: api.dev.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: api-tls
            hosts:
              - api.dev.${DOMAIN_2}
      managementIngress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          # redirect /swagger -> /q/swagger-ui (regex only matches /swagger, other paths pass through)
          traefik.ingress.kubernetes.io/router.middlewares: hopps-dev-swagger-redirect@kubernetescrd
        hosts:
          - host: api.dev.${DOMAIN_2}
            paths:
              - path: /q/swagger-ui
                pathType: Prefix
              - path: /q/openapi
                pathType: Prefix
              - path: /swagger
                pathType: Exact
        tls:
          - secretName: api-tls
            hosts:
              - api.dev.${DOMAIN_2}
    # frontend
    frontend:
      image:
        tag: "1286"
      envFrom:
        - secretRef:
            name: frontend
      # Impressum/Datenschutz: link to the canonical pages on the landing site
      # (hopps.app). Read at runtime by the frontend server. Takes effect once a
      # frontend image containing the configurable-legal-pages feature is deployed.
      envVars:
        - name: HOPPS_IMPRINT_URL
          value: https://hopps.app/impressum
        - name: HOPPS_PRIVACY_URL
          value: https://hopps.app/datenschutz
        # Login via oidc-client-ts (hopps-app/hopps#817): the SPA no longer reads
        # VITE_KEYCLOAK_* and refuses to start without these two. Set ahead of
        # the merge, older images ignore them. The client id stays in the
        # secret; VITE_KEYCLOAK_* can be removed from it once the admin app has
        # followed (hopps-app/hopps#838).
        - name: VITE_OIDC_PROVIDER_URL
          value: https://id.dev.hopps.cloud/realms/hopps
        - name: VITE_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: frontend
              key: VITE_KEYCLOAK_CLIENT_ID
        # Must be set explicitly: the build minifies away the SPA's default scope
        - name: VITE_OIDC_SCOPE
          value: openid profile email
      podSecurityContext:
        fsGroup: 1000
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        ingressClassName: traefik
        hosts:
          - host: dev.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: frontend-tls
            hosts:
              - dev.${DOMAIN_2}
    # admin
    admin:
      image:
        tag: "120"
      envFrom:
        - secretRef:
            name: frontend
      envVars:
        - name: VITE_KEYCLOAK_CLIENT_ID
          value: hopps-dev-admin
        # member-facing SPA impersonation
        - name: VITE_SPA_URL
          value: https://dev.${DOMAIN_2}
      podSecurityContext:
        fsGroup: 1000
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        ingressClassName: traefik
        hosts:
          - host: admin.dev.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: admin-tls
            hosts:
              - admin.dev.${DOMAIN_2}
    zugferd:
      image:
        tag: "1014"
      envFrom:
        - secretRef:
            name: zugferd
    # use already available keycloak
    keycloak:
      command:
        - /opt/keycloak/bin/kc.sh
        - start
      cache:
        type: local
        stack: ""
      # Traefik terminates TLS and forwards X-Forwarded-* headers, so Keycloak
      # must parse those (xforwarded) instead of the RFC 7239 `Forwarded` header
      # (chart default `forwarded`). Without this Keycloak builds http:// URLs.
      proxy:
        mode: xforwarded
      extraEnv: |
        - name: KC_HOSTNAME
          value: https://id.dev.hopps.cloud
      http:
        # For backwards compatibility reasons we set this to the value used by previous Keycloak versions.
        relativePath: "/"
      image:
        tag: 204-keycloak-26.2.1
      enabled: true
      database:
        vendor: postgres
        hostname: postgres-cluster-rw
        port: 5432
        database: keycloak
        username: keycloak
        existingSecret: keycloak-db-secret
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.middlewares: hopps-dev-cors-keycloak@kubernetescrd
          # ToDo: re-implement public /metrics block (server-snippet replacement) — either via
          # Keycloak/Quarkus management interface or a dedicated traefik IngressRoute that 403s the path
        rules:
          - host: id.dev.${DOMAIN_2}
            paths:
              - path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/'
                pathType: Prefix
        tls:
          - secretName: keycloak-tls
            hosts:
              - id.dev.${DOMAIN_2}
        ingressClassName: traefik
      serviceMonitor:
        enabled: true
    # mail-dev (GreenMail + Roundcube)
    mailDev:
      enabled: true
      roundcube:
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          ingressClassName: traefik
          hosts:
            - host: mail.dev.${DOMAIN_2}
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: mail-dev-tls
              hosts:
                - mail.dev.${DOMAIN_2}
