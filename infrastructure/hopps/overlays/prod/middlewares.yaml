# CORS for the org/management API (frontend + admin origin)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "https://${DOMAIN_2}"
      - "https://admin.${DOMAIN_2}"
    accessControlMaxAge: 100
    addVaryHeader: true
---
# CORS for Keycloak — impersonation via the admin SPA needs credentialed
# requests, so credentials must be allowed and headers listed explicitly
# (a wildcard is ignored for credentialed requests)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-keycloak
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowCredentials: true
    accessControlAllowHeaders:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "X-Requested-With"
    accessControlAllowOriginList:
      - "https://${DOMAIN_2}"
      - "https://admin.${DOMAIN_2}"
    accessControlMaxAge: 100
    addVaryHeader: true
---
# Strip /org prefix before forwarding to the org backend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-org
spec:
  stripPrefix:
    prefixes:
      - /org
---
# Allow up to 50 MiB request bodies for the org API
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-50m
spec:
  buffering:
    maxRequestBodyBytes: 52428800
